<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Story, Vero ❤️</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(180deg,#000000,#2b0018,#000000);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.container{
text-align:center;
max-width:420px;
padding:20px;
border-radius:20px;
background:rgba(255,255,255,0.08);
box-shadow:0 0 40px rgba(255,100,150,0.4);
animation:fadeIn 1.5s;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(30px);}
to{opacity:1; transform:translateY(0);}
}

h2{
color:#ff9acb;
}

p{
font-size:18px;
line-height:1.6;
min-height:80px;
}

button{
padding:12px 25px;
margin-top:20px;
border:none;
border-radius:25px;
background:#ff4e88;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
box-shadow:0 0 15px #ff4e88;
}

.photo{
width:180px;
height:180px;
border-radius:50%;
border:4px solid white;
box-shadow:0 0 30px white;
margin-top:15px;
object-fit:cover;
}

.heart{
position:absolute;
font-size:20px;
animation:floatUp 4s linear infinite;
}

@keyframes floatUp{
from{
transform:translateY(100vh);
opacity:1;
}
to{
transform:translateY(-10vh);
opacity:0;
}
}

</style>
</head>

<body>

<div class="container" id="story">

<h2>A Story with Vero ❤️</h2>

<p id="text">Click to begin...</p>

<button onclick="nextScene()">Start</button>

</div>

<script>

let step = 0;

const scenes = [

{
title: "Strangers 🌙",
text: "It all started with a simple Hi who are you on Instagram... Two strangers, not knowing how special this connection would become."
},

{
title: "Friends 😊",
text: "Slowly, conversations became longer. Laughs became real. Strangers became friends."
},

{
title: "Close to Heart 💫",
text: "Every message from you became important. Every notification from Vero made my heart happy."
},

{
title: "Feelings ❤️",
text: "Somewhere between those chats, you became more than just a friend. You became someone truly special."
},

{
title: "Distance 🌍",
text: "Even when distance exists, the care, the bond, and the connection never fades."
},

{
title: "Vero 💖",
text: "Cutie pie Vero, you are not just someone I met... you are someone who became a beautiful part of my life. Chella kuttyyy Vero, you will always be special. My precious venney mavaleyy ❤️",
photo: true
}

];

function nextScene(){

if(step < scenes.length){

let scene = scenes[step];

document.getElementById("story").innerHTML = `
<h2>${scene.title}</h2>
<p id="text"></p>
${scene.photo ? '<img src="vero.jpg" class="photo-glow">' : ''}
<button onclick="nextScene()">Next ❤️</button>
`;

typeText(scene.text);

step++;

}else{

document.getElementById("story").innerHTML = `
<h2>Forever Connected ❤️</h2>
<p id="text"></p>
`;

typeText("No matter where life goes... Vero will always be special in my heart 💖");

}

}

// FIXED typing effect
function typeText(text){

let element = document.getElementById("text");

element.innerHTML = "";

let i = 0;
let speed = 35;

function typing(){

if(i < text.length){

element.innerHTML += text.charAt(i);

i++;

setTimeout(typing, speed);

}

}

typing();

}

// floating hearts
function createHeart(){

let heart=document.createElement("div");

heart.innerHTML="💖";

heart.className="heart";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(15+Math.random()*20)+"px";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),4000);

}

setInterval(createHeart,800);

</script>

</body>
</html>
