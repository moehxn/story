<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<title>RRB Tech-III Trainer — Smart Study & Quiz Trainer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231d4ed8'/><text x='50' y='68' font-size='48' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>T3</text></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="topbar-inner">
      <div class="brand" id="brand">
        <span class="brand-badge">T3</span>
        <div class="brand-text">
          <strong>RRB Tech-III Trainer</strong>
          <small>Technician Grade III &bull; Smart Study &amp; Quiz Trainer</small>
        </div>
      </div>
      <div id="topbar-actions"></div>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav id="bottomnav" aria-label="Main navigation"></nav>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
</div>
<script>
/* Boot watchdog — if the app fails to start, show the reason ON SCREEN
   instead of a blank page. Plain JS, no modules, runs even if they fail. */
(function () {
  var problems = [];
  window.addEventListener('error', function (e) {
    var src = (e.target && e.target.src) ? ' (file: ' + e.target.src + ')' : '';
    if (e.message || src) problems.push((e.message || 'A file failed to load') + src);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    problems.push('Promise error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  function panel(msg) {
    var v = document.getElementById('view');
    if (!v || (v.innerHTML || '').trim()) return; /* app is rendering — never overwrite it */
    v.innerHTML = '<div style="font-family:system-ui;padding:24px 16px;max-width:480px;margin:0 auto;line-height:1.5">'
      + '<h3 style="margin:0 0 8px">&#9203; The app is taking longer than usual to start</h3>'
      + '<p style="color:#475569;font-size:14px;margin:0 0 12px">' + msg + '</p>'
      + (problems.length
          ? '<p style="font-size:12px;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:8px">Report: ' + problems.join('<br>') + '</p>'
          : '<p style="font-size:12px;color:#475569">No code errors detected — this is likely a slow or interrupted internet connection.</p>')
      + '<button onclick="location.reload()" style="padding:10px 18px;border:0;border-radius:8px;background:#1d4ed8;color:#fff;font-size:15px">Reload</button>'
      + '<p style="color:#94a3b8;font-size:12px;margin-top:12px">If this keeps happening: open this page in a Chrome incognito tab (Chrome menu &rarr; New incognito tab) and paste the report above.</p>'
      + '</div>';
  }
  setTimeout(function () {
    panel('Your connection may be slow, or a file failed to load. Check your internet and tap Reload.');
  }, 6000);
})();
</script>
<script type="module" src="js/main.js"></script>
<noscript><div style="font-family:system-ui;padding:24px;text-align:center">Please enable JavaScript to use the RRB Trainer.</div></noscript>
</body>
</html>
